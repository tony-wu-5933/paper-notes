<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#111111"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#777777"/>
    </marker>
  </defs>

  <!-- Row 1: three phases -->
  <text x="20" y="26" font-size="14" fill="#555555">三個階段（依序執行，由 Summarizer 傳遞摘要）</text>

  <rect x="30" y="40" width="220" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="140" y="66" font-size="15" fill="#111111" text-anchor="middle">Reconnaissance</text>
  <text x="140" y="85" font-size="13" fill="#555555" text-anchor="middle">偵察（Nmap, Dirb）</text>

  <rect x="340" y="40" width="220" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="450" y="66" font-size="15" fill="#111111" text-anchor="middle">Scanning</text>
  <text x="450" y="85" font-size="13" fill="#555555" text-anchor="middle">掃描（Nikto, WPScan）</text>

  <rect x="650" y="40" width="220" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="760" y="66" font-size="15" fill="#111111" text-anchor="middle">Exploitation</text>
  <text x="760" y="85" font-size="13" fill="#555555" text-anchor="middle">入侵（Metasploit, Hydra）</text>

  <line x1="250" y1="70" x2="335" y2="70" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="292" y="63" font-size="11" fill="#555555" text-anchor="middle">Summarizer</text>

  <line x1="560" y1="70" x2="645" y2="70" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="602" y="63" font-size="11" fill="#555555" text-anchor="middle">Summarizer</text>

  <!-- Row 2: internal loop detail -->
  <rect x="30" y="130" width="840" height="420" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="46" y="154" font-size="13" fill="#555555">每個階段內部的運作迴圈（以其中一個階段為例，三階段各自重複一次）</text>

  <!-- Planner -->
  <rect x="80" y="190" width="170" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="165" y="216" font-size="15" fill="#111111" text-anchor="middle">Planner</text>
  <text x="165" y="236" font-size="12" fill="#555555" text-anchor="middle">Plan Session /</text>
  <text x="165" y="250" font-size="12" fill="#555555" text-anchor="middle">Task Session</text>

  <!-- Memory Retriever -->
  <rect x="80" y="330" width="170" height="64" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <text x="165" y="356" font-size="15" fill="#111111" text-anchor="middle">Memory</text>
  <text x="165" y="374" font-size="13" fill="#111111" text-anchor="middle">Retriever</text>
  <text x="165" y="390" font-size="11" fill="#555555" text-anchor="middle">向量資料庫（RAG，僅 RAG 實驗使用）</text>

  <line x1="165" y1="254" x2="165" y2="326" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowGray)" marker-start="url(#arrowGray)"/>
  <text x="178" y="294" font-size="11" fill="#555555">查詢 / 更新</text>

  <!-- Generator -->
  <rect x="370" y="190" width="170" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="455" y="216" font-size="15" fill="#111111" text-anchor="middle">Generator</text>
  <text x="455" y="236" font-size="12" fill="#555555" text-anchor="middle">任務 →</text>
  <text x="455" y="250" font-size="12" fill="#555555" text-anchor="middle">工具指令</text>

  <!-- Executor -->
  <rect x="640" y="190" width="170" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="725" y="216" font-size="15" fill="#111111" text-anchor="middle">Executor</text>
  <text x="725" y="236" font-size="12" fill="#555555" text-anchor="middle">透過 Paramiko</text>
  <text x="725" y="250" font-size="12" fill="#555555" text-anchor="middle">操作互動式 shell</text>

  <!-- Target environment -->
  <rect x="640" y="330" width="170" height="64" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <text x="725" y="356" font-size="15" fill="#111111" text-anchor="middle">Target</text>
  <text x="725" y="374" font-size="13" fill="#111111" text-anchor="middle">Environment</text>
  <text x="725" y="390" font-size="11" fill="#555555" text-anchor="middle">目標機器</text>

  <!-- Arrows: Planner -> Generator -> Executor -> Target -->
  <line x1="250" y1="222" x2="365" y2="222" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="307" y="215" font-size="11" fill="#555555" text-anchor="middle">下一步任務</text>

  <line x1="540" y1="222" x2="635" y2="222" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="587" y="215" font-size="11" fill="#555555" text-anchor="middle">command</text>

  <line x1="725" y1="254" x2="725" y2="326" stroke="#111111" stroke-width="1.5" marker-end="url(#arrowGray)" marker-start="url(#arrow)"/>
  <text x="742" y="294" font-size="11" fill="#555555">執行 / 回傳結果</text>

  <!-- Feedback: Executor result back to Planner -->
  <path d="M640,230 L290,230 L290,254" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="465" y="270" font-size="11" fill="#555555" text-anchor="middle">結果回饋，Planner 更新 / 反思計畫（PTG）</text>

  <text x="46" y="440" font-size="12" fill="#555555">成功的任務與關鍵資訊（如開放的 port、拿到的 shell 權限）由 Summarizer 彙整後，</text>
  <text x="46" y="458" font-size="12" fill="#555555">傳給下一個階段的 Planner，作為下一階段的 context。</text>

  <text x="450" y="585" font-size="11" fill="#888888" text-anchor="middle">自製示意圖，依論文 §3.1–§3.5 文字描述繪製（非原文 Fig. 2 的逐一重製）</text>
</svg>
